name: Validation temporaire du Guide Sécurité

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  validate-guide:
    if: github.head_ref == 'feat/guide-securite-pki-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/guide-securite-pki-v2
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Raccorder le Guide au moteur et au hub
        run: python scripts/_temp_build_security_guide.py
      - name: Installer les dépendances
        run: npm ci
      - name: Construire le site
        run: npm run build
      - name: Valider le Guide et enregistrer le Top 10
        run: |
          python - <<'PY'
          from pathlib import Path
          import html as html_lib
          import json
          import re

          page = Path('dist/guides/securite-pki/meilleures-offres-gratuites/index.html')
          existing = [
              Path('dist/guides/email/meilleures-offres-gratuites/index.html'),
              Path('dist/guides/api-donnees-ml/meilleures-offres-gratuites/index.html'),
              Path('dist/guides/depots-code-source/meilleures-offres-gratuites/index.html'),
              Path('dist/guides/supervision/meilleures-offres-gratuites/index.html'),
              Path('dist/guides/tests/meilleures-offres-gratuites/index.html'),
              Path('dist/guides/ci-cd/meilleures-offres-gratuites/index.html'),
          ]
          assert page.exists(), 'Route Sécurité absente'
          assert all(path.exists() for path in existing), 'Régression sur un Guide existant'

          content = page.read_text(encoding='utf-8')
          for label in ('Analyses / scans', 'Projets / actifs', 'Secrets / certificats'):
              assert label in content, f'Comparateur spécifique absent : {label}'
          for forbidden in ('Volume d’envoi', 'IA / crédits', 'Dépôts / projets', 'Ressources surveillées', 'Tests / exécutions', 'Builds / déploiements'):
              assert forbidden not in content, f'Comparateur d’une autre catégorie présent : {forbidden}'

          canonical = 'https://gratuitpourlesdevs.fr/guides/securite-pki/meilleures-offres-gratuites/'
          assert canonical in content, 'Canonical Sécurité absent'

          item_list = None
          for raw in re.findall(r'<script[^>]*type="application/ld\+json"[^>]*>(.*?)</script>', content, flags=re.S):
              try:
                  data = json.loads(html_lib.unescape(raw))
              except json.JSONDecodeError:
                  continue
              candidates = data if isinstance(data, list) else [data]
              for candidate in candidates:
                  if isinstance(candidate, dict) and candidate.get('@type') == 'ItemList':
                      item_list = candidate
                      break
              if item_list:
                  break
          assert item_list, 'ItemList SEO introuvable'
          names = [item.get('name') for item in item_list.get('itemListElement', [])]
          assert len(names) == 10, f'10 offres attendues, trouvé {len(names)} : {names}'
          report = 'TOP_10_SECURITY=' + ' | '.join(names) + '\n'
          print(report.strip())
          Path('_temp_security_top10.txt').write_text(report, encoding='utf-8')
          PY
      - name: Publier les fichiers validés et le rapport temporaire
        run: |
          git config user.name 'GratuitPourLesDevs'
          git config user.email 'julien.taverne+gratuitpourlesdevs@gmail.com'
          git add -- src/pages/comparatifs/email/meilleures-offres-gratuites.astro src/pages/guides/index.astro _temp_security_top10.txt
          if git diff --cached --quiet; then
            echo 'Aucune modification supplémentaire.'
            exit 0
          fi
          git commit -m 'Raccorde et valide le guide Sécurité'
          git push origin HEAD:feat/guide-securite-pki-v2
