name: Validation temporaire comparatif E-mail responsive

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Construire le site
        run: npm run build
      - name: Vérifier le comparatif responsive
        run: |
          test -f dist/guides/email/meilleures-offres-gratuites/index.html
          grep -q '@media (max-width: 980px)' src/pages/guides/email/meilleures-offres-gratuites.astro
          grep -q "content: 'Quota clé'" src/pages/guides/email/meilleures-offres-gratuites.astro
          grep -q 'grid-template-columns: repeat(2, minmax(0, 1fr))' src/pages/guides/email/meilleures-offres-gratuites.astro
          grep -q '@media (max-width: 680px)' src/pages/guides/email/meilleures-offres-gratuites.astro
          grep -q '<th>Quota clé</th>' src/pages/comparatifs/email/meilleures-offres-gratuites.astro
