name: Déployer sur GitHub Pages

# Important : ne pas inclure [skip ci] / [ci skip] dans les commits fusionnés sur main,
# sinon GitHub ignore entièrement ce workflow déclenché par push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  prepare-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Appliquer le patch temporaire du Guide si présent
        run: |
          if [ ! -f scripts/_temp_apply_source_code_guide.py ]; then exit 0; fi
          python scripts/_temp_apply_source_code_guide.py
          git config user.name 'GratuitPourLesDevs'
          git config user.email 'julien.taverne+gratuitpourlesdevs@gmail.com'
          git add -- src/data/source-code-guide.ts src/data/free-tier-score.ts src/pages/comparatifs/email/meilleures-offres-gratuites.astro src/pages/guides/index.astro src/pages/guides/depots-code-source/meilleures-offres-gratuites.astro
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalise le guide Dépôts de code source'
          git push origin HEAD:main

  build:
    needs: prepare-guide
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Installer, vérifier et préparer le site
        uses: withastro/action@v6
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
