name: Déployer sur GitHub Pages

# Important : ne pas inclure [skip ci] / [ci skip] dans les commits fusionnés sur main,
# sinon GitHub ignore entièrement ce workflow déclenché par push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Installer, vérifier et préparer le site
        uses: withastro/action@v6
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          PUBLIC_ADSENSE_ENABLED: ${{ vars.PUBLIC_ADSENSE_ENABLED }}
          # L'identifiant éditeur est public. La valeur du dépôt reste prioritaire,
          # avec ce repli pour que la validation du domaine ne dépende pas d'une
          # variable GitHub manquante.
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT || 'ca-pub-4480723880776093' }}
          PUBLIC_ADSENSE_CATALOGUE_SLOT: ${{ vars.PUBLIC_ADSENSE_CATALOGUE_SLOT }}
          PUBLIC_ADSENSE_GUIDE_SLOT: ${{ vars.PUBLIC_ADSENSE_GUIDE_SLOT }}
          PUBLIC_ADSENSE_OFFER_SLOT: ${{ vars.PUBLIC_ADSENSE_OFFER_SLOT }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
