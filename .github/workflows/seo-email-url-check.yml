name: Validation temporaire URL SEO E-mail

on:
  push:
    branches:
      - feat/seo-email-url

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier et construire le site
        run: npm run build
      - name: Vérifier la nouvelle route
        run: |
          test -f dist/comparatifs/email/meilleures-offres-gratuites/index.html
          test ! -e dist/comparatifs/email/10-meilleures-offres-gratuites/index.html
