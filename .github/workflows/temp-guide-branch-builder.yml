name: Builder temporaire de Guide

on:
  push:
    branches: [feat/guide-source-code]

permissions:
  contents: write

jobs:
  build-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/guide-source-code
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Appliquer les modifications préparées
        run: python scripts/_temp_apply_source_code_guide.py
      - run: npm ci
      - run: npm run build
      - name: Vérifier le nouveau guide
        run: python scripts/_temp_validate_source_code_guide.py
      - name: Enregistrer les modifications fonctionnelles
        run: |
          git config user.name 'GratuitPourLesDevs'
          git config user.email 'julien.taverne+gratuitpourlesdevs@gmail.com'
          git add -- src/data/source-code-guide.ts src/data/free-tier-score.ts src/pages/comparatifs/email/meilleures-offres-gratuites.astro src/pages/guides/index.astro src/pages/guides/depots-code-source/meilleures-offres-gratuites.astro
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Ajoute le guide Dépôts de code source'
          git push origin HEAD:feat/guide-source-code
