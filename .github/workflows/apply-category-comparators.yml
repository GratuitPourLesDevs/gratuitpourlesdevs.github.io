name: Appliquer les comparateurs spécifiques

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/guides-category-comparators
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Adapter le moteur des guides
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/comparatifs/email/meilleures-offres-gratuites.astro')
          text = path.read_text()

          type_pattern = re.compile(r"type GuideConfig = \{.*?\n\};\n\nconst GUIDE_CONFIGS", re.S)
          type_replacement = """type ComparisonColumn =
            | { key: 'service' | 'type' | 'plan' | 'duration' | 'overage' | 'card' | 'usage'; label: string }
            | { key: 'quota'; label: string; metrics: string[] };

          type GuideConfig = {
            categoryLabelFallback: string;
            fallbackDescription: string;
            pageTitle: (rankingSize: number) => string;
            pageDescription: (rankingSize: number) => string;
            heroTitle: (rankingSize: number) => string;
            heroIntro: string;
            rankingTitle: (rankingSize: number) => string;
            itemListName: (rankingSize: number) => string;
            quotaPriority: string[];
            comparisonIntro: string;
            comparisonColumns: ComparisonColumn[];
            faqItems: Array<{ question: string; answer: string }>;
          };

          const GUIDE_CONFIGS"""
          text, count = type_pattern.subn(type_replacement, text, count=1)
          assert count == 1, 'Bloc GuideConfig introuvable'

          email_anchor = "    quotaPriority: ['emails', 'messages', 'storage', 'domains', 'users', 'seats'],\n    faqItems: ["
          email_replacement = """    quotaPriority: ['emails', 'messages', 'storage', 'domains', 'users', 'seats'],
            comparisonIntro: 'Pour l’e-mail, le tableau distingue le volume d’envoi et les capacités de domaines ou comptes, en plus des conditions générales du plan gratuit.',
            comparisonColumns: [
              { key: 'service', label: 'Service' },
              { key: 'type', label: 'Type d’e-mail' },
              { key: 'quota', label: 'Volume d’envoi', metrics: ['emails', 'messages', 'deliveries'] },
              { key: 'quota', label: 'Domaines / comptes', metrics: ['domains', 'users', 'seats', 'contacts', 'subscribers', 'recipients'] },
              { key: 'plan', label: 'Formule gratuite' },
              { key: 'duration', label: 'Gratuité' },
              { key: 'overage', label: 'Dépassement' },
              { key: 'card', label: 'Carte bancaire' },
              { key: 'usage', label: 'Usage idéal' },
            ],
            faqItems: ["""
          assert email_anchor in text, 'Ancre config E-mail introuvable'
          text = text.replace(email_anchor, email_replacement, 1)

          api_anchor = "    quotaPriority: ['requests', 'operations', 'executions', 'queries', 'api_calls', 'calls', 'tokens', 'credit', 'credits', 'records', 'searches', 'predictions', 'inferences', 'compute', 'storage'],\n    faqItems: ["
          api_replacement = """    quotaPriority: ['requests', 'operations', 'executions', 'queries', 'api_calls', 'calls', 'tokens', 'credit', 'credits', 'records', 'searches', 'predictions', 'inferences', 'compute', 'storage'],
            comparisonIntro: 'Cette catégorie mélange API, données et ML : les quotas sont donc séparés par nature afin de ne pas comparer artificiellement une requête API, un crédit IA et un volume de stockage.',
            comparisonColumns: [
              { key: 'service', label: 'Service' },
              { key: 'type', label: 'Type de service' },
              { key: 'quota', label: 'Activité API', metrics: ['requests', 'operations', 'executions', 'queries', 'api_calls', 'calls', 'searches'] },
              { key: 'quota', label: 'IA / crédits', metrics: ['tokens', 'credit', 'credits', 'predictions', 'inferences', 'compute'] },
              { key: 'quota', label: 'Données / stockage', metrics: ['records', 'storage', 'bandwidth', 'datasets', 'rows', 'data_rows'] },
              { key: 'plan', label: 'Formule gratuite' },
              { key: 'duration', label: 'Gratuité' },
              { key: 'overage', label: 'Dépassement' },
              { key: 'card', label: 'Carte bancaire' },
              { key: 'usage', label: 'Usage idéal' },
            ],
            faqItems: ["""
          assert api_anchor in text, 'Ancre config API/Data/ML introuvable'
          text = text.replace(api_anchor, api_replacement, 1)

          old_faq = "Un million de requêtes API, quelques crédits d’IA ou un volume de stockage ne se comparent pas directement. Le score évalue l’utilité réelle du free tier, tandis que le comparatif rapide affiche le quota le plus représentatif de chaque service afin de conserver le contexte."
          new_faq = "Un million de requêtes API, quelques crédits d’IA ou un volume de stockage ne se comparent pas directement. Le comparatif les sépare donc en trois familles — activité API, IA/crédits et données/stockage — et n’affiche une valeur que lorsqu’un quota structuré correspondant est documenté."
          assert old_faq in text, 'FAQ quota API introuvable'
          text = text.replace(old_faq, new_faq, 1)

          helper_pattern = re.compile(r"const QUOTA_PRIORITY = new Map<string, number>\(guideConfig\.quotaPriority.*?const getOverageTone = \(quota\?: OfferQuota\) => \{.*?\n\};", re.S)
          helper_replacement = """const QUOTA_PRIORITY = new Map<string, number>(guideConfig.quotaPriority.map((metric, index) => [metric, index]));
          const getQuickQuota = (offerId: string) => [...getOfferQuotas(offerId)].sort((a, b) =>
            (QUOTA_PRIORITY.get(a.metric) ?? 99) - (QUOTA_PRIORITY.get(b.metric) ?? 99)
          )[0];
          const getQuotaForMetrics = (offerId: string, metrics: string[]) => {
            const priority = new Map(metrics.map((metric, index) => [metric, index]));
            return [...getOfferQuotas(offerId)]
              .filter((quota) => priority.has(quota.metric))
              .sort((a, b) => (priority.get(a.metric) ?? 99) - (priority.get(b.metric) ?? 99))[0];
          };
          const getOverageTone = (quota?: OfferQuota) => {
            if (!quota) return 'neutral';
            if (quota.overage === 'billed') return 'negative';
            if (quota.overage === 'not-applicable') return 'positive';
            return 'warning';
          };"""
          text, count = helper_pattern.subn(helper_replacement, text, count=1)
          assert count == 1, 'Helpers quotas introuvables'

          comparison_pattern = re.compile(r"    <section class=\"seo-comparison\" id=\"comparatif\">.*?    </section>\n\n    <section class=\"seo-method-faq\">", re.S)
          comparison_replacement = """    <section class=\"seo-comparison\" id=\"comparatif\">
            <header class=\"seo-section-heading\">
              <div><small>VUE D’ENSEMBLE</small><h2>Comparatif rapide</h2></div>
              <p>{guideConfig.comparisonIntro}</p>
            </header>

            <div class=\"seo-table-shell\">
              <table>
                <thead>
                  <tr>
                    {guideConfig.comparisonColumns.map((column) => <th>{column.label}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {rankedOffers.map(({ entry, score }) => {
                    const scoreTone = getScoreTone(score.total);
                    const quickQuota = getQuickQuota(entry.id);
                    return (
                      <tr>
                        {guideConfig.comparisonColumns.map((column) => {
                          const quota = column.key === 'quota' ? getQuotaForMetrics(entry.id, column.metrics) : undefined;
                          return (
                            <td data-label={column.label} class:list={[{ 'seo-quota-cell': column.key === 'quota' }]}>
                              {column.key === 'service' ? <><a class:list={['offer-score-tile', 'seo-table-score', `is-${scoreTone}`]} href={`/offres/${entry.id}/#score-gratuitpourlesdevs`} aria-label={`Score de ${entry.data.nom} : ${score.total} sur 100`}><b>{score.total}</b><span>/100</span></a><a href={`/offres/${entry.id}/`}>{entry.data.nom}</a></> :
                               column.key === 'type' ? entry.data.type :
                               column.key === 'quota' ? (quota ? <><strong>{formatQuotaAmount(quota)} · {formatQuotaPeriod(quota)}</strong><small>{quota.label}</small></> : <span class=\"seo-undocumented\">Non documenté</span>) :
                               column.key === 'plan' ? entry.data.formule :
                               column.key === 'duration' ? <span class:list={['seo-binary', entry.data.permanent ? 'positive' : 'warning']}>{entry.data.permanent ? 'Permanente' : 'Essai limité'}</span> :
                               column.key === 'overage' ? (quickQuota ? <span class:list={['seo-binary', getOverageTone(quickQuota)]}>{formatQuotaOverage(quickQuota)}</span> : <span class=\"seo-binary neutral\">Non documenté</span>) :
                               column.key === 'card' ? <span class:list={['seo-binary', entry.data.carteRequise ? 'negative' : 'positive']}>{entry.data.carteRequise ? 'Requise' : 'Non requise'}</span> :
                               column.key === 'usage' ? entry.data.usages.slice(0, 2).join(' · ') : null}
                            </td>
                          );
                        })}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </section>

          <section class=\"seo-method-faq\">"""
          text, count = comparison_pattern.subn(comparison_replacement, text, count=1)
          assert count == 1, 'Section comparatif introuvable'

          text = text.replace('min-width:1420px;font-size:11.5px', 'min-width:1540px;font-size:11.5px', 1)
          text = text.replace('.seo-quota-cell small{margin-top:3px;color:var(--muted);font-size:9.5px;line-height:1.4}', '.seo-quota-cell small{margin-top:3px;color:var(--muted);font-size:9.5px;line-height:1.4}.seo-undocumented{color:var(--muted);font-size:10.5px}', 1)

          labels_pattern = re.compile(r"    \.seo-comparison \.seo-table-shell tbody td:nth-child\(n\+2\)::before\{.*?    \.seo-comparison \.seo-table-shell tbody td:nth-child\(8\)::before\{content:'Usage idéal'\}\n", re.S)
          labels_replacement = """    .seo-comparison .seo-table-shell tbody td:not(:first-child)::before{content:attr(data-label);color:var(--muted);font:700 9px var(--mono);letter-spacing:.35px;line-height:1.35;text-transform:uppercase}
          """
          text, count = labels_pattern.subn(labels_replacement, text, count=1)
          assert count == 1, 'Libellés responsive historiques introuvables'
          text = text.replace('.seo-comparison .seo-table-shell tbody td:nth-child(n+2)::before{font-size:8.5px}', '.seo-comparison .seo-table-shell tbody td:not(:first-child)::before{font-size:8.5px}', 1)

          path.write_text(text)
          PY
      - name: Vérifier le build et les comparateurs
        run: |
          npm ci
          npm run build
          test -f dist/guides/email/meilleures-offres-gratuites/index.html
          test -f dist/guides/api-donnees-ml/meilleures-offres-gratuites/index.html
          grep -q 'Volume d’envoi' dist/guides/email/meilleures-offres-gratuites/index.html
          grep -q 'Domaines / comptes' dist/guides/email/meilleures-offres-gratuites/index.html
          grep -q 'Activité API' dist/guides/api-donnees-ml/meilleures-offres-gratuites/index.html
          grep -q 'IA / crédits' dist/guides/api-donnees-ml/meilleures-offres-gratuites/index.html
          grep -q 'Données / stockage' dist/guides/api-donnees-ml/meilleures-offres-gratuites/index.html
          grep -q 'content:attr(data-label)' src/pages/comparatifs/email/meilleures-offres-gratuites.astro
      - name: Publier le moteur validé sur la branche
        run: |
          git config user.name 'GratuitPourLesDevs'
          git config user.email 'julien.taverne+gratuitpourlesdevs@gmail.com'
          git add -- src/pages/comparatifs/email/meilleures-offres-gratuites.astro
          git commit -m 'Rend les comparateurs spécifiques aux catégories [skip ci]'
          git push origin HEAD:feat/guides-category-comparators
