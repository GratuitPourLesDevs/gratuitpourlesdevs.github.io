name: Validation temporaire guide API données ML

on:
  push:
    branches: [feat/guide-api-donnees-ml]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          ref: feat/guide-api-donnees-ml
      - name: Corriger le garde-fou TypeScript
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/comparatifs/email/meilleures-offres-gratuites.astro')
          text = path.read_text()
          old = "const guideConfig = GUIDE_CONFIGS[CATEGORY_ID];"
          new = "const guideConfig = GUIDE_CONFIGS[CATEGORY_ID] ?? GUIDE_CONFIGS.email!;"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          if ! git diff --quiet; then
            git config user.name "GratuitPourLesDevs"
            git config user.email "julien.taverne+gratuitpourlesdevs@gmail.com"
            git add src/pages/comparatifs/email/meilleures-offres-gratuites.astro
            git commit -m "Sécurise la configuration du guide partagé"
            git push origin HEAD:feat/guide-api-donnees-ml
          fi
      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Construire le site
        run: npm run build
      - name: Vérifier les deux guides
        run: |
          test -f dist/guides/email/meilleures-offres-gratuites/index.html
          test -f dist/guides/api-donnees-ml/meilleures-offres-gratuites/index.html
          grep -q 'API, données et machine learning' dist/guides/api-donnees-ml/meilleures-offres-gratuites/index.html
          grep -q '/guides/api-donnees-ml/meilleures-offres-gratuites/' dist/guides/index.html
      - name: Vérifier le Top 10 et afficher le classement
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('dist/guides/api-donnees-ml/meilleures-offres-gratuites/index.html').read_text()
          rows = len(re.findall(r'<article[^>]*class="[^"]*seo-offer-row', html))
          if rows != 10:
              raise SystemExit(f'Le guide contient {rows} offres au lieu de 10')
          names = re.findall(r'seo-offer-title[^>]*>.*?<h3[^>]*><a[^>]*>(.*?)</a>', html, flags=re.S)
          clean = [re.sub(r'<[^>]+>', '', n).strip() for n in names[:10]]
          print('Top 10 détecté :')
          for i, name in enumerate(clean, 1):
              print(f'{i}. {name}')
          PY
      - name: Vérifier le responsive partagé
        run: |
          grep -q '@media(max-width:980px)' src/pages/comparatifs/email/meilleures-offres-gratuites.astro
          grep -q "content:'Quota clé'" src/pages/comparatifs/email/meilleures-offres-gratuites.astro
          grep -q 'categoryId="email"' src/pages/guides/email/meilleures-offres-gratuites.astro
          grep -q 'categoryId="api-donnees-ml"' src/pages/guides/api-donnees-ml/meilleures-offres-gratuites.astro
