name: Validation temporaire critères comparatif E-mail

on:
  push:
    branches:
      - feat/email-guide-comparison-criteria

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          ref: feat/email-guide-comparison-criteria

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enrichir le comparatif E-mail
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pages/comparatifs/email/meilleures-offres-gratuites.astro')
          source = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              if new in source:
                  return
              if old not in source:
                  raise SystemExit(f'Bloc introuvable: {label}')
              source = source.replace(old, new, 1)

          replace_once(
              "import { getFreeTierScore } from '../../../data/free-tier-score';",
              "import { getFreeTierScore } from '../../../data/free-tier-score';\nimport { formatQuotaAmount, formatQuotaOverage, formatQuotaPeriod, getOfferQuotas, type OfferQuota } from '../../../data/offer-quotas';",
              'import quotas',
          )

          replace_once(
              "const getKeyPoints = (entry: (typeof rankedOffers)[number]['entry']) => {\n  const source = [...entry.data.inclus, ...entry.data.usages, ...entry.data.conditions];\n  return [...new Set(source)].slice(0, 3);\n};\n---",
              "const getKeyPoints = (entry: (typeof rankedOffers)[number]['entry']) => {\n  const source = [...entry.data.inclus, ...entry.data.usages, ...entry.data.conditions];\n  return [...new Set(source)].slice(0, 3);\n};\n\nconst EMAIL_QUOTA_PRIORITY = new Map<string, number>([\n  ['emails', 0],\n  ['messages', 1],\n  ['storage', 2],\n  ['domains', 3],\n  ['users', 4],\n  ['seats', 5],\n]);\nconst getQuickQuota = (offerId: string) => [...getOfferQuotas(offerId)].sort((a, b) =>\n  (EMAIL_QUOTA_PRIORITY.get(a.metric) ?? 99) - (EMAIL_QUOTA_PRIORITY.get(b.metric) ?? 99)\n)[0];\nconst getOverageTone = (quota?: OfferQuota) => {\n  if (!quota) return 'neutral';\n  if (quota.overage === 'billed') return 'negative';\n  if (quota.overage === 'not-applicable') return 'positive';\n  return 'warning';\n};\n---",
              'helpers comparatif',
          )

          replace_once(
              "              <th>Service</th>\n              <th>Type</th>\n              <th>Formule gratuite</th>\n              <th>Carte bancaire</th>\n              <th>Usage idéal</th>",
              "              <th>Service</th>\n              <th>Type</th>\n              <th>Quota clé</th>\n              <th>Formule gratuite</th>\n              <th>Durée</th>\n              <th>Dépassement</th>\n              <th>Carte bancaire</th>\n              <th>Usage idéal</th>",
              'entêtes tableau',
          )

          replace_once(
              "            {rankedOffers.map(({ entry, score }) => {\n              const scoreTone = getScoreTone(score.total);\n              return (\n                <tr>\n                  <td><a class:list={['offer-score-tile', 'seo-table-score', `is-${scoreTone}`]} href={`/offres/${entry.id}/#score-gratuitpourlesdevs`} aria-label={`Score de ${entry.data.nom} : ${score.total} sur 100`}><b>{score.total}</b><span>/100</span></a><a href={`/offres/${entry.id}/`}>{entry.data.nom}</a></td>\n                  <td>{entry.data.type}</td>\n                  <td>{entry.data.formule}</td>\n                  <td><span class:list={['seo-binary', entry.data.carteRequise ? 'negative' : 'positive']}>{entry.data.carteRequise ? 'Requise' : 'Non requise'}</span></td>\n                  <td>{entry.data.usages.slice(0, 2).join(' · ')}</td>\n                </tr>\n              );\n            })}",
              "            {rankedOffers.map(({ entry, score }) => {\n              const scoreTone = getScoreTone(score.total);\n              const quickQuota = getQuickQuota(entry.id);\n              return (\n                <tr>\n                  <td><a class:list={['offer-score-tile', 'seo-table-score', `is-${scoreTone}`]} href={`/offres/${entry.id}/#score-gratuitpourlesdevs`} aria-label={`Score de ${entry.data.nom} : ${score.total} sur 100`}><b>{score.total}</b><span>/100</span></a><a href={`/offres/${entry.id}/`}>{entry.data.nom}</a></td>\n                  <td>{entry.data.type}</td>\n                  <td class=\"seo-quota-cell\">{quickQuota ? <><strong>{formatQuotaAmount(quickQuota)} · {formatQuotaPeriod(quickQuota)}</strong><small>{quickQuota.label}</small></> : <span>Non documenté</span>}</td>\n                  <td>{entry.data.formule}</td>\n                  <td><span class:list={['seo-binary', entry.data.permanent ? 'positive' : 'warning']}>{entry.data.permanent ? 'Permanente' : 'Essai limité'}</span></td>\n                  <td>{quickQuota ? <span class:list={['seo-binary', getOverageTone(quickQuota)]}>{formatQuotaOverage(quickQuota)}</span> : <span class=\"seo-binary neutral\">Non documenté</span>}</td>\n                  <td><span class:list={['seo-binary', entry.data.carteRequise ? 'negative' : 'positive']}>{entry.data.carteRequise ? 'Requise' : 'Non requise'}</span></td>\n                  <td>{entry.data.usages.slice(0, 2).join(' · ')}</td>\n                </tr>\n              );\n            })}",
              'lignes tableau',
          )

          replace_once(
              ".seo-table-shell table{width:100%;border-collapse:collapse;min-width:980px;font-size:11.5px}",
              ".seo-table-shell table{width:100%;border-collapse:collapse;min-width:1420px;font-size:11.5px}",
              'largeur tableau',
          )

          replace_once(
              ".seo-table-score b{font-size:14px}.seo-table-score span{font-size:7px}.seo-binary{display:inline-flex;padding:4px 7px;border-radius:4px;font-size:10px;font-weight:750}.seo-binary.positive{color:var(--green);background:rgb(22 132 91/9%)}.seo-binary.negative{color:#a23b30;background:#fff0ee}",
              ".seo-table-score b{font-size:14px}.seo-table-score span{font-size:7px}.seo-quota-cell{min-width:165px}.seo-quota-cell strong,.seo-quota-cell small{display:block}.seo-quota-cell strong{font-size:11.5px;line-height:1.4}.seo-quota-cell small{margin-top:3px;color:var(--muted);font-size:9.5px;line-height:1.4}.seo-binary{display:inline-flex;padding:4px 7px;border-radius:4px;font-size:10px;font-weight:750;line-height:1.35}.seo-binary.positive{color:var(--green);background:rgb(22 132 91/9%)}.seo-binary.negative{color:#a23b30;background:#fff0ee}.seo-binary.warning{color:#8a5700;background:#fff7df}.seo-binary.neutral{color:var(--muted);background:var(--soft)}",
              'styles critères',
          )

          replace_once(
              ":global([data-theme=\"dark\"]) .seo-key-points li{color:#c0c6d0}:global([data-theme=\"dark\"]) .seo-binary.negative,:global([data-theme=\"dark\"]) .seo-movement.is-down{color:#ffaaa1;background:#492422}",
              ":global([data-theme=\"dark\"]) .seo-key-points li{color:#c0c6d0}:global([data-theme=\"dark\"]) .seo-binary.negative,:global([data-theme=\"dark\"]) .seo-movement.is-down{color:#ffaaa1;background:#492422}:global([data-theme=\"dark\"]) .seo-binary.warning{color:#ffd27a;background:#3d3420}",
              'mode sombre',
          )

          path.write_text(source)
          PY

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier et construire le site
        run: npm run build

      - name: Vérifier le comparatif enrichi
        run: |
          test -f dist/comparatifs/email/meilleures-offres-gratuites/index.html
          grep -q 'Quota clé' dist/comparatifs/email/meilleures-offres-gratuites/index.html
          grep -q 'Durée' dist/comparatifs/email/meilleures-offres-gratuites/index.html
          grep -q 'Dépassement' dist/comparatifs/email/meilleures-offres-gratuites/index.html

      - name: Publier la modification sur la branche
        run: |
          if git diff --quiet -- src/pages/comparatifs/email/meilleures-offres-gratuites.astro; then
            echo 'Aucune modification à publier.'
            exit 0
          fi
          git config user.name 'GratuitPourLesDevs'
          git config user.email 'julien.taverne+gratuitpourlesdevs@gmail.com'
          git add src/pages/comparatifs/email/meilleures-offres-gratuites.astro
          git commit -m 'Enrichit le comparatif rapide E-mail'
          git push origin HEAD:feat/email-guide-comparison-criteria
