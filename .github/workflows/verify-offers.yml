name: Vérifier les offres

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: verify-offers
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le catalogue
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Vérifier les offres en ligne
        run: node scripts/verify-offers.mjs

      - name: Installer les dépendances
        run: npm ci

      - name: Valider le catalogue avant publication
        run: |
          npm run test:verify-offers
          npm run build

      - name: Enregistrer les changements de statut
        id: commit
        run: |
          git config user.name "GratuitPourLesDevs Bot"
          git config user.email "julien.taverne+gratuitpourlesdevs@gmail.com"
          git add src/content/offres
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Vérification automatique des offres"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruire le site après modification
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
