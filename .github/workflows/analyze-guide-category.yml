name: Analyse catégorie Guide

on:
  push:
    branches: [feat/guide-ci-cd]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Analyser les catégories
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          rows=[]
          for p in Path('src/content/offres').glob('*.md'):
              text=p.read_text(errors='ignore')
              cat=re.search(r'^categorie:\s*["\']?([^\n"\']+)', text, re.M)
              nom=re.search(r'^nom:\s*["\']?([^\n"\']+)', text, re.M)
              statut=re.search(r'^statut:\s*["\']?([^\n"\']+)', text, re.M)
              if not cat: continue
              category=cat.group(1).strip()
              status=(statut.group(1).strip() if statut else 'active')
              if status != 'obsolete':
                  rows.append((category, p.stem, nom.group(1).strip() if nom else p.stem))

          counts=Counter(r[0] for r in rows)
          print('TOP_CATEGORIES')
          for cat,count in counts.most_common(20): print(f'{cat}: {count}')

          quota_text=Path('src/data/offer-quotas.ts').read_text(errors='ignore')
          candidates=['ci-cd','cdn-protection','supervision','tests','securite-pki','identite-acces','depots-code-source']
          for category in candidates:
              target=[r for r in rows if r[0]==category]
              metrics=Counter(); covered=0
              print(f'CATEGORY={category}|COUNT={len(target)}')
              for _,slug,nom in target:
                  m=re.search(rf"  '{re.escape(slug)}': \[(.*?)(?=\n  '[^']+': \[|\n\}};)" , quota_text, re.S)
                  found=[]
                  if m:
                      found=re.findall(r"metric:\s*'([^']+)'", m.group(1))
                  if found:
                      covered += 1
                      metrics.update(found)
                  print(f'OFFER={category}|{slug}|{nom}|METRICS={",".join(found) if found else "-"}')
              print(f'COVERAGE={category}|{covered}/{len(target)}')
              for metric,count in metrics.most_common(): print(f'METRIC={category}|{metric}|{count}')
          PY
