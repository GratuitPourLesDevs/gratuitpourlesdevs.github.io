name: Analyse catégorie Guide

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifier la maturité Dépôts de code source
        run: |
          cat > /tmp/analyze-source-code.ts <<'TS'
          import '/home/runner/work/gratuitpourlesdevs.github.io/gratuitpourlesdevs.github.io/src/data/offer-quota-overrides.ts';
          import '/home/runner/work/gratuitpourlesdevs.github.io/gratuitpourlesdevs.github.io/src/data/parsivex-quota.ts';
          import '/home/runner/work/gratuitpourlesdevs.github.io/gratuitpourlesdevs.github.io/src/data/source-code-hosting-quotas.ts';
          import '/home/runner/work/gratuitpourlesdevs.github.io/gratuitpourlesdevs.github.io/src/data/api-service-quotas.ts';
          import '/home/runner/work/gratuitpourlesdevs.github.io/gratuitpourlesdevs.github.io/src/data/data-service-quotas.ts';
          import '/home/runner/work/gratuitpourlesdevs.github.io/gratuitpourlesdevs.github.io/src/data/data-tools-quotas.ts';
          import { getOfferQuotas } from '/home/runner/work/gratuitpourlesdevs.github.io/gratuitpourlesdevs.github.io/src/data/offer-quotas.ts';
          import fs from 'node:fs';
          import path from 'node:path';

          const root='/home/runner/work/gratuitpourlesdevs.github.io/gratuitpourlesdevs.github.io';
          const dir=path.join(root,'src/content/offres');
          const scoreText=fs.readFileSync(path.join(root,'src/data/free-tier-score.ts'),'utf8');
          const rows=[] as Array<{slug:string,nom:string}>;
          for (const file of fs.readdirSync(dir).filter((f)=>f.endsWith('.md'))) {
            const text=fs.readFileSync(path.join(dir,file),'utf8');
            const cat=text.match(/^categorie:\s*["']?([^\n"']+)/m)?.[1]?.trim();
            const status=text.match(/^statut:\s*["']?([^\n"']+)/m)?.[1]?.trim() ?? 'active';
            if(cat!=='depots-code-source' || status==='obsolete') continue;
            const nom=text.match(/^nom:\s*["']?([^\n"']+)/m)?.[1]?.trim() ?? file.replace(/\.md$/,'');
            rows.push({slug:file.replace(/\.md$/,''),nom});
          }
          console.log(`SOURCE_CODE_COUNT=${rows.length}`);
          for(const row of rows){
            const quotas=getOfferQuotas(row.slug);
            const hasScore = new RegExp(`['\"]?${row.slug.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}['\"]?\\s*:\\s*(5|10|15|20|25)`).test(scoreText);
            console.log(`SOURCE_CODE=${row.slug}|${row.nom}|SCORE=${hasScore ? 'yes':'no'}|QUOTAS=${quotas.map(q=>`${q.metric}:${q.label}:${q.amount ?? q.kind}:${q.unit}:${q.period}`).join(';') || '-'}`);
          }
          TS
          npx --yes tsx /tmp/analyze-source-code.ts
