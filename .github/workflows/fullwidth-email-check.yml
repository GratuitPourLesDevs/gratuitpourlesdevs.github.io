name: Validation temporaire lisibilite guide E-mail

on:
  push:
    branches:
      - feat/fullwidth-readable-email-guide

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v7
      - name: Preparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dependances
        run: npm ci
      - name: Verifier et construire le site
        run: npm run build
      - name: Verifier la route E-mail
        run: test -f dist/comparatifs/email/meilleures-offres-gratuites/index.html
