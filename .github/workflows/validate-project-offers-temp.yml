name: Validation temporaire offres gestion de projet

on:
  push:
    branches:
      - ajout-gestion-projet-2026-08-22
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Générer le lot d’offres
        run: |
          cat .tmp/project-offers-archive.part1 \
              .tmp/project-offers-archive.part2 \
              .tmp/project-offers-archive.part3 \
              .tmp/project-offers-archive.part4 | base64 -d > /tmp/project-offers.tar.gz
          tar -xzf /tmp/project-offers.tar.gz
          python - <<'PY'
          from pathlib import Path
          path = Path('src/data/storage-compute-additions.ts')
          text = path.read_text()
          import_line = "import { PROJECT_MANAGEMENT_QUOTA_SCORES } from './project-management-additions';"
          if import_line not in text:
              marker = "import { TUNNEL_NETWORK_QUOTA_SCORES } from './tunnel-network-additions';"
              text = text.replace(marker, marker + '\n' + import_line)
          spread_line = '  ...PROJECT_MANAGEMENT_QUOTA_SCORES,'
          if spread_line not in text:
              marker = '  ...TUNNEL_NETWORK_QUOTA_SCORES,'
              text = text.replace(marker, marker + '\n' + spread_line)
          path.write_text(text)
          PY

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      - name: Enregistrer le lot validé
        run: |
          git config user.name "GratuitPourLesDevs Bot"
          git config user.email "julien.taverne+gratuitpourlesdevs@gmail.com"
          git add src/content/offres src/data/project-management-additions.ts src/data/storage-compute-additions.ts
          if git diff --cached --quiet; then
            echo "Aucun changement fonctionnel à committer."
          else
            git commit -m "Ajoute 56 outils de gestion de projet"
            git push origin HEAD:ajout-gestion-projet-2026-08-22
          fi

# Relance après activation du workflow sur main.
