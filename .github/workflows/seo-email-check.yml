name: Validation temporaire page SEO E-mail

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/seo-email-top-10

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier et construire le site
        run: npm run build
