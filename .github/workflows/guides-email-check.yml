name: Validation temporaire Guides et classement E-mail

on:
  push:
    branches:
      - feat/guides-email-ranking
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier et construire le site
        run: npm run build
      - name: Vérifier les routes Guides
        run: |
          test -f dist/comparatifs/index.html
          test -f dist/comparatifs/email/meilleures-offres-gratuites/index.html
          grep -q 'Guides' dist/comparatifs/index.html
          grep -q 'Voir l’offre' dist/comparatifs/email/meilleures-offres-gratuites/index.html
