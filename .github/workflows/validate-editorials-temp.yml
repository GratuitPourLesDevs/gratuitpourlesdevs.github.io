name: Validation temporaire éditoriaux

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/data/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la PR
        uses: actions/checkout@v6
      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Construire le site
        run: npm run build
