backend:
  name: github
  repo: GratuitPourLesDevs/gratuitpourlesdevs.github.io
  branch: main
  base_url: https://gratuitpourlesdevs-oauth.gratuitpourlesdevsallianciasolutions.workers.dev
  auth_endpoint: auth
  auth_scope: public_repo
  squash_merges: true

publish_mode: editorial_workflow
locale: fr
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: categories
    label: Catégories
    label_singular: Catégorie
    folder: src/content/categories
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: nom
    summary: "{{ordre}} · {{nom}}"
    sortable_fields: [nom, ordre, actif]
    fields:
      - { label: Nom, name: nom, widget: string }
      - { label: Nom dans la source, name: nomSource, widget: string, hint: "Libellé anglais utilisé par free-for.dev" }
      - { label: Description, name: description, widget: text }
      - { label: Ordre, name: ordre, widget: number, value_type: int, default: 100 }
      - { label: Active, name: actif, widget: boolean, default: true }

  - name: offres
    label: Offres en ligne
    label_singular: Offre
    folder: src/content/offres
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    filter: { field: statut, value: active }
    summary: "{{nom}} · {{type}} · vérifié le {{verifieLe}}"
    sortable_fields: [nom, type, verifieLe, ordre]
    fields: &offer_fields
      - { label: Nom, name: nom, widget: string }
      - { label: Accroche, name: accroche, widget: string }
      - { label: Modèle de service, name: type, widget: select, options: [SaaS, PaaS, IaaS, BaaS, API, "Service managé", Ressource] }
      - label: Catégorie
        name: categorie
        widget: relation
        collection: categories
        search_fields: [nom, nomSource]
        display_fields: [nom]
        value_field: "{{slug}}"
      - { label: Formule gratuite, name: formule, widget: text }
      - { label: Ce qui est inclus, name: inclus, widget: list, field: { label: Élément, name: element, widget: string } }
      - { label: Conditions, name: conditions, widget: list, field: { label: Condition, name: element, widget: string } }
      - { label: Restrictions, name: restrictions, widget: list, field: { label: Restriction, name: element, widget: string } }
      - { label: Usages, name: usages, widget: list }
      - { label: Site officiel, name: url, widget: string }
      - { label: Documentation, name: documentation, widget: string, required: false }
      - { label: Source tarifaire, name: source, widget: string }
      - { label: Couleur, name: couleur, widget: color, default: "#0b45ff" }
      - { label: Initiales, name: initiales, widget: string, hint: "Deux caractères de préférence" }
      - { label: Carte bancaire requise, name: carteRequise, widget: boolean, default: false }
      - { label: Formule permanente, name: permanent, widget: boolean, default: true }
      - label: Statut
        name: statut
        widget: select
        default: active
        options:
          - { label: Active, value: active }
          - { label: À vérifier, value: a_verifier }
          - { label: Obsolète, value: obsolete }
      - { label: Vérification automatique le, name: verificationAutomatiqueLe, widget: datetime, required: false, date_format: YYYY-MM-DD, time_format: false }
      - { label: Note de vérification, name: verificationNote, widget: text, required: false }
      - { label: Mise en avant, name: vedette, widget: boolean, default: false }
      - { label: Priorité de classement (interne), name: ordre, widget: number, value_type: int, default: 100, hint: "Clé de tri interne potentiellement non continue. Ne correspond ni au numéro de l’offre ni au nombre total d’offres du catalogue." }
      - { label: Vérifié le, name: verifieLe, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Pourquoi c'est utile, name: body, widget: markdown }

  - name: offres_a_verifier
    label: À vérifier
    label_singular: Offre à vérifier
    folder: src/content/offres
    create: false
    delete: false
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    filter: { field: statut, value: a_verifier }
    summary: "{{nom}} · {{verificationNote}}"
    sortable_fields: [nom, type, verificationAutomatiqueLe, verifieLe]
    fields: *offer_fields

  - name: archives
    label: Archives
    label_singular: Offre archivée
    folder: src/content/offres
    create: false
    delete: false
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    filter: { field: statut, value: obsolete }
    summary: "{{nom}} · {{verificationNote}}"
    sortable_fields: [nom, type, verificationAutomatiqueLe, verifieLe]
    fields: *offer_fields

  - name: affiliations
    label: "💰 Affiliation"
    label_singular: Programme d'affiliation
    folder: src/content/affiliations
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: nom
    summary: "{{nom}} · {{statut}} · {{commission}}"
    sortable_fields: [nom, statut, priorite, verifieLe]
    fields:
      - { label: Nom du programme, name: nom, widget: string }
      - { label: Fournisseur, name: fournisseur, widget: string }
      - { label: Type de programme, name: typeProgramme, widget: select, options: [{label: Affiliation, value: affiliation}, {label: Referral, value: referral}, {label: Partenaire B2B, value: partenaire}] }
      - { label: Réseau / plateforme, name: reseau, widget: string, hint: "Direct, AWIN, CJ, Dub, PartnerStack, Trackdesk..." }
      - { label: URL d'inscription, name: urlInscription, widget: string }
      - { label: URL du dashboard affilié, name: urlDashboard, widget: string, required: false }
      - { label: URL des conditions, name: urlConditions, widget: string, required: false }
      - label: Statut
        name: statut
        widget: select
        default: opportunite
        options:
          - { label: Opportunité, value: opportunite }
          - { label: Candidature à faire, value: candidature_a_faire }
          - { label: Candidature envoyée, value: candidature_envoyee }
          - { label: En attente, value: en_attente }
          - { label: Actif, value: active }
          - { label: En pause, value: pause }
          - { label: Refusé, value: refusee }
          - { label: À revalider, value: a_revalider }
          - { label: Terminé, value: terminee }
      - { label: Modèle de rémunération, name: remunerationMode, widget: select, options: [CPA, CPL, pourcentage, recurrent, hybride, credits] }
      - { label: Commission, name: commission, widget: string }
      - { label: Durée de commission, name: dureeCommission, widget: string, required: false }
      - { label: Cookie (jours), name: cookieJours, widget: number, value_type: int, min: 0, required: false }
      - { label: Seuil de paiement, name: seuilPaiement, widget: string, required: false }
      - { label: Devise, name: devise, widget: string, default: EUR }
      - { label: Paiement, name: paiement, widget: string, required: false }
      - { label: Fréquence de paiement, name: frequencePaiement, widget: string, required: false }
      - label: Offres GPLD liées
        name: offres
        widget: list
        field: { label: Offre, name: offre, widget: relation, collection: offres, search_fields: [nom, accroche], display_fields: [nom], value_field: "{{slug}}" }
      - { label: URL affiliée générique, name: urlAffiliee, widget: string, required: false, hint: "Ne renseigner qu'après acceptation. Tant que ce champ et les liens par offre sont vides, rien n'est publié." }
      - label: Liens affiliés par offre
        name: liensOffres
        widget: list
        required: false
        fields:
          - { label: Offre, name: offre, widget: relation, collection: offres, search_fields: [nom, accroche], display_fields: [nom], value_field: "{{slug}}" }
          - { label: URL affiliée, name: url, widget: string }
      - { label: Deep links autorisés, name: deepLink, widget: boolean, default: false }
      - { label: SubID / tracking secondaire, name: subId, widget: boolean, default: false }
      - { label: Code promo, name: codePromo, widget: string, required: false }
      - { label: Avantage utilisateur, name: avantageUtilisateur, widget: text, required: false }
      - { label: Vérifié le, name: verifieLe, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Source officielle, name: source, widget: string }
      - { label: Prochaine vérification, name: prochaineVerification, widget: datetime, required: false, date_format: YYYY-MM-DD, time_format: false }
      - { label: Note interne, name: noteInterne, widget: text, required: false }
      - { label: Priorité commerciale, name: priorite, widget: number, value_type: int, default: 100, hint: "Plus la valeur est faible, plus le programme est prioritaire. Ce score ne modifie jamais le classement éditorial." }

  - name: campagnes
    label: "📣 Campagnes"
    label_singular: Campagne d'affiliation
    folder: src/content/campagnes
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: nom
    summary: "{{nom}} · {{statut}} · priorité {{priorite}}"
    sortable_fields: [nom, statut, priorite, dateDebut, dateFin]
    fields:
      - { label: Nom interne, name: nom, widget: string }
      - { label: Programme, name: programme, widget: relation, collection: affiliations, search_fields: [nom, fournisseur], display_fields: [nom, statut], value_field: "{{slug}}" }
      - label: Offres GPLD
        name: offres
        widget: list
        field: { label: Offre, name: offre, widget: relation, collection: offres, search_fields: [nom, accroche], display_fields: [nom], value_field: "{{slug}}" }
      - { label: Titre public, name: titrePublic, widget: string }
      - { label: Texte public, name: textePublic, widget: text }
      - { label: CTA, name: cta, widget: string }
      - { label: Badge, name: badge, widget: string, default: "Sélection partenaire" }
      - { label: Statut, name: statut, widget: select, default: brouillon, options: [{label: Brouillon, value: brouillon}, {label: Active, value: active}, {label: Pause, value: pause}, {label: Terminée, value: terminee}] }
      - { label: Début, name: dateDebut, widget: datetime, required: false, date_format: YYYY-MM-DD, time_format: false }
      - { label: Fin, name: dateFin, widget: datetime, required: false, date_format: YYYY-MM-DD, time_format: false }
      - { label: Priorité d'affichage, name: priorite, widget: number, value_type: int, default: 100 }
      - { label: Placements, name: placements, widget: select, multiple: true, options: [{label: Accueil, value: accueil}, {label: Catalogue / catégorie, value: catalogue}, {label: Fiche offre, value: fiche}, {label: Guide, value: guide}, {label: Comparatif, value: comparatif}] }
      - label: Catégories ciblées
        name: categories
        widget: list
        required: false
        field: { label: Catégorie, name: categorie, widget: relation, collection: categories, search_fields: [nom, nomSource], display_fields: [nom], value_field: "{{slug}}" }
      - { label: URL de campagne spécifique, name: urlDestination, widget: string, required: false, hint: "Surcharge facultative de l'URL affiliée du programme." }
      - { label: Avantage utilisateur, name: avantageUtilisateur, widget: text, required: false }
      - { label: Mention transparence, name: disclosure, widget: string, default: "Lien affilié · aucun surcoût · soutient GratuitPourLesDevs" }
