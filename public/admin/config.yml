backend:
  name: github
  repo: GratuitPourLesDevs/gratuitpourlesdevs.github.io
  branch: main
  base_url: https://gratuitpourlesdevs-oauth.gratuitpourlesdevsallianciasolutions.workers.dev
  auth_endpoint: auth
  auth_scope: public_repo
  squash_merges: true

publish_mode: editorial_workflow
locale: fr
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: categories
    label: Catégories
    label_singular: Catégorie
    folder: src/content/categories
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: nom
    summary: "{{ordre}} · {{nom}}"
    sortable_fields: [nom, ordre, actif]
    fields:
      - { label: Nom, name: nom, widget: string }
      - { label: Nom dans la source, name: nomSource, widget: string, hint: "Libellé anglais utilisé par free-for.dev" }
      - { label: Description, name: description, widget: text }
      - { label: Ordre, name: ordre, widget: number, value_type: int, default: 100 }
      - { label: Active, name: actif, widget: boolean, default: true }

  - name: offres
    label: Offres en ligne
    label_singular: Offre
    folder: src/content/offres
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    filter: { field: statut, value: active }
    summary: "{{nom}} · {{type}} · vérifié le {{verifieLe}}"
    sortable_fields: [nom, type, verifieLe, ordre]
    fields: &offer_fields
      - { label: Nom, name: nom, widget: string }
      - { label: Accroche, name: accroche, widget: string }
      - { label: Modèle de service, name: type, widget: select, options: [SaaS, PaaS, IaaS, BaaS, API, "Service managé", Ressource] }
      - label: Catégorie
        name: categorie
        widget: relation
        collection: categories
        search_fields: [nom, nomSource]
        display_fields: [nom]
        value_field: "{{slug}}"
      - { label: Formule gratuite, name: formule, widget: text }
      - { label: Ce qui est inclus, name: inclus, widget: list, field: { label: Élément, name: element, widget: string } }
      - { label: Conditions, name: conditions, widget: list, field: { label: Condition, name: element, widget: string } }
      - { label: Restrictions, name: restrictions, widget: list, field: { label: Restriction, name: element, widget: string } }
      - { label: Usages, name: usages, widget: list }
      - { label: Site officiel, name: url, widget: string }
      - { label: Documentation, name: documentation, widget: string, required: false }
      - { label: Source tarifaire, name: source, widget: string }
      - { label: Couleur, name: couleur, widget: color, default: "#0b45ff" }
      - { label: Initiales, name: initiales, widget: string, hint: "Deux caractères de préférence" }
      - { label: Carte bancaire requise, name: carteRequise, widget: boolean, default: false }
      - { label: Formule permanente, name: permanent, widget: boolean, default: true }
      - label: Statut
        name: statut
        widget: select
        default: active
        options:
          - { label: Active, value: active }
          - { label: À vérifier, value: a_verifier }
          - { label: Obsolète, value: obsolete }
      - { label: Vérification automatique le, name: verificationAutomatiqueLe, widget: datetime, required: false, date_format: YYYY-MM-DD, time_format: false }
      - { label: Note de vérification, name: verificationNote, widget: text, required: false }
      - { label: Mise en avant, name: vedette, widget: boolean, default: false }
      - { label: Ordre, name: ordre, widget: number, value_type: int, default: 100 }
      - { label: Vérifié le, name: verifieLe, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Pourquoi c'est utile, name: body, widget: markdown }

  - name: offres_a_verifier
    label: À vérifier
    label_singular: Offre à vérifier
    folder: src/content/offres
    create: false
    delete: false
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    filter: { field: statut, value: a_verifier }
    summary: "{{nom}} · {{verificationNote}}"
    sortable_fields: [nom, type, verificationAutomatiqueLe, verifieLe]
    fields: *offer_fields

  - name: archives
    label: Archives
    label_singular: Offre archivée
    folder: src/content/offres
    create: false
    delete: false
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    filter: { field: statut, value: obsolete }
    summary: "{{nom}} · {{verificationNote}}"
    sortable_fields: [nom, type, verificationAutomatiqueLe, verifieLe]
    fields: *offer_fields
