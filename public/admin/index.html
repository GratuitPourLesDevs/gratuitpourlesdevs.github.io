<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Administration — Gratuit pour les devs</title>
    <style>
      .admin-shortcuts {
        position: fixed;
        z-index: 999999;
        right: 18px;
        bottom: 18px;
        display: grid;
        gap: 8px;
      }
      .admin-shortcuts a {
        padding: 11px 16px;
        color: #fff;
        background: #0b45ff;
        border-radius: 7px;
        box-shadow: 0 8px 24px rgb(0 0 0/20%);
        font:
          700 13px system-ui,
          sans-serif;
        text-decoration: none;
        text-align: center;
      }
      .admin-shortcuts a.secondary {
        background: #111827;
      }
      .admin-shortcuts a:hover {
        filter: brightness(0.9);
      }
    </style>
  </head>
  <body>
    <nav class="admin-shortcuts" aria-label="Raccourcis administration">
      <a class="secondary" href="/admin/radar/">Dashboard radar</a>
      <a class="secondary" href="/admin/affiliation/">Dashboard affiliation</a>
      <a href="/admin/verification/">Vérifier les offres</a>
      <a href="/admin/monetisation/">Configurer AdSense</a>
    </nav>
    <script>
      const nativeFetch = window.fetch.bind(window);
      window.fetch = (input, init = {}) => {
        const requestUrl = typeof input === "string" ? input : input.url;
        const isDecapConfig = new URL(
          requestUrl,
          window.location.href,
        ).pathname.endsWith("/admin/config.yml");
        return nativeFetch(
          input,
          isDecapConfig ? { ...init, cache: "no-store" } : init,
        );
      };
    </script>
    <script src="https://unpkg.com/decap-cms@^3.8.0/dist/decap-cms.js"></script>
  </body>
</html>
